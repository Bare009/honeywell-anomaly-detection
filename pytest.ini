[pytest]
# Tests live only under tests/ -- this stops pytest from importing the frontend,
# notebooks or artifacts directories during collection.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Concise, fail-fast-friendly output.
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

markers =
    slow: takes more than a couple of seconds (training smoke tests)
    integration: needs a running dependency (MongoDB/Redis) or crosses module boundaries
    metrics: asserts a target metric threshold from section 4 of the plan

# pytest-asyncio: plain `async def test_...` works without a decorator.
asyncio_mode = auto

filterwarnings =
    default
